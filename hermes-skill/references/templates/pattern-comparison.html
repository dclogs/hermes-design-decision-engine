<!-- Pattern 1: 方案对比（面向决策者） -->
<!-- 参考 Stripe Pricing / IBM Carbon Comparison -->
<div class="container">
  <header><!-- 标题 + 副标题 --></header>
  <div class="exec-summary"><!-- 推荐框：结论先行 --></div>
  <div class="table-wrapper">
    <table class="comparison-table">
      <thead><tr><th><!-- 维度 --></th><th><!-- A方案 --></th><th><!-- B方案 --></th></tr></thead>
      <tbody>
        <tr><th><!-- 维度名 --></th><td><!-- 数据+desc --></td><td><!-- 数据+desc --></td></tr>
        <!-- 6-10 行，sticky 首列，推荐列高亮 -->
      </tbody>
    </table>
  </div>
  <div class="pre-note"><!-- ⚠ 初稿说明 --></div>
  <footer><!-- 数据来源 + 版本 --></footer>
</div>
